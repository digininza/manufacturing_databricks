resources:
  jobs:
    mfg_table_maintenance:
      name: "[${var.environment}] mfg_table_maintenance"
      tags: {project: northforge-mfg, layer: maintenance}
      schedule:
        quartz_cron_expression: "0 0 3 ? * SUN"   # weekly, outside the 02:00-06:00 batch window
        timezone_id: UTC
        pause_status: UNPAUSED
      email_notifications:
        on_failure: ["${var.notification_email}"]
      parameters:
        - {name: environment, default: "${var.environment}"}
      job_clusters:
        - job_cluster_key: maint
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type}      # compute-optimized is fine; OPTIMIZE is CPU (compression) + I/O bound
            autoscale: {min_workers: 2, max_workers: 8}
            data_security_mode: SINGLE_USER
            runtime_engine: PHOTON              # Photon speeds up OPTIMIZE rewrites significantly
      tasks:
        - task_key: optimize_vacuum
          job_cluster_key: maint
          notebook_task:
            notebook_path: ../../notebooks/08_maintenance/optimize_vacuum.py
            base_parameters: {job_run_id: "{{job.run_id}}"}
